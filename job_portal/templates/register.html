{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-6 col-lg-4">
<div class="card p-4">
<h2 class="card-title text-center mb-4 text-indigo-700">Register</h2>
{% if error %}
<div class="alert alert-danger" role="alert">{{ error }}</div>
{% endif %}
<form method="POST" action="{{ url_for('auth.register') }}">
<div class="mb-3">
<label for="username" class="form-label">Username</label>
<input type="text" class="form-control" id="username" name="username" required>
</div>
<div class="mb-3">
<label for="password" class="form-label">Password</label>
<input type="password" class="form-control" id="password" name="password" required>
</div>
<div class="mb-4">
<label for="role" class="form-label">I am a...</label>
<select class="form-select" id="role" name="role" required>
<option value="applicant" selected>Jobseeker (Applicant)</option>
<option value="recruiter">Employer (Recruiter)</option>
{# Admin option is hidden for standard registration #}
</select>
</div>
<button type="submit" class="btn btn-primary w-100">Create Account</button>
<p class="text-center mt-3 text-muted">
Already have an account? <a href="{{ url_for('auth.login') }}" class="text-indigo-600 hover:text-indigo-800">Login here</a>
</p>
</form>
</div>
</div>
</div>
{% endblock %}
