{% extends "base.html" %}

{% block title %}Post Job{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-md-8">
<div class="card p-5">
<h2 class="card-title mb-4 text-indigo-700">Post a New Job Opening</h2>
{% if message %}
<div class="alert alert-success" role="alert">{{ message }}</div>
{% endif %}
<form method="POST" action="{{ url_for('recruiter.post_job') }}">
<div class="mb-3">
<label for="title" class="form-label">Job Title</label>
<input type="text" class="form-control" id="title" name="title" required>
</div>
<div class="mb-3">
<label for="company" class="form-label">Company Name</label>
<input type="text" class="form-control" id="company" name="company" required>
</div>
<div class="mb-4">
<label for="description" class="form-label">Job Description</label>
<textarea class="form-control" id="description" name="description" rows="8" required></textarea>
</div>
<button type="submit" class="btn btn-primary w-100">Publish Job</button>
</form>
</div>
</div>
</div>
{% endblock %}
